# /etc/nginx/sites-available/gestion_proyectos.conf  ->  enlazar en sites-enabled
# HTTPS: sudo certbot --nginx -d proyectos.walkcode.pe
upstream gestion_proyectos_app {
    server 127.0.0.1:8003;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name proyectos.walkcode.pe;
    server_tokens off;
    client_max_body_size 12m;

    location /static/ {
        alias /opt/gestion_proyectos/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://gestion_proyectos_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
