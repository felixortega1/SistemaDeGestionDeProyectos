# /etc/nginx/sites-available/gestion  ->  enlazar en sites-enabled
# Reemplazar gestion.TU-DOMINIO.com. Certbot agrega el bloque 443 con: certbot --nginx -d gestion.TU-DOMINIO.com
server {
    listen 80;
    server_name gestion.TU-DOMINIO.com;

    client_max_body_size 5m;

    # Estaticos servidos directo por nginx (collectstatic -> /opt/gestion/staticfiles)
    location /static/ {
        alias /opt/gestion/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
