{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<h1>Crear cuenta</h1>
<form method="post" class="card narrow">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Registrarme</button>
</form>
<p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock %}
